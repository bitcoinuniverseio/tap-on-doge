name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, universe]
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check validator.js
      - name: Check JSON syntax
        run: |
          node -e 'for (const file of ["docs.manifest.json", "search-index.json"]) JSON.parse(require("fs").readFileSync(file, "utf8"))'
